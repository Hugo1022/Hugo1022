<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>记得做 · 任务清单</title>
<style>
:root{--ink:#222723;--muted:#778079;--line:#e8e9e3;--paper:#fff;--bg:#f7f6f2;--green:#315d47;--light:#e8f0e9;--orange:#b76636;--red:#ba5047;--shadow:0 12px 40px #25372a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1050px;margin:auto;padding:44px 28px 72px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:17px;letter-spacing:.02em}.mark{width:34px;height:34px;background:var(--green);color:white;border-radius:11px;display:grid;place-items:center;font-size:18px}.today{color:var(--muted);font-size:13px}.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;margin-bottom:30px}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,44px);line-height:1.2;letter-spacing:-.045em;margin:8px 0}.hero p{margin:0;color:var(--muted)}.count-pill{background:var(--light);color:var(--green);padding:10px 14px;border-radius:99px;font-size:13px;font-weight:650;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.main{padding:22px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.section-head h2{font-size:16px;margin:0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:0;background:transparent;padding:7px 10px;border-radius:9px;color:var(--muted);font-size:12px}.filter.active{background:#f0f2ee;color:var(--ink);font-weight:650}.form{display:grid;grid-template-columns:1fr 112px 175px auto;gap:8px;padding:10px;background:#f8f8f5;border:1px solid var(--line);border-radius:13px;margin-bottom:20px}.form input,.form select{min-width:0;border:1px solid transparent;background:white;border-radius:8px;padding:10px 11px;color:var(--ink);outline:none}.form input:focus,.form select:focus{border-color:#a9bcae}.form input::placeholder{color:#a3aaa4}.add{border:0;background:var(--green);color:white;border-radius:8px;padding:0 15px;font-weight:650}.add:hover{background:#244a36}.list{display:flex;flex-direction:column}.task{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:15px 3px;border-bottom:1px solid #eff0ec}.task:last-child{border-bottom:0}.check{appearance:none;width:19px;height:19px;border:1.5px solid #c8cec8;border-radius:6px;margin:2px 0 0;cursor:pointer;position:relative}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:"✓";position:absolute;color:white;font-size:13px;left:3px;top:-1px}.task-title{font-weight:600;font-size:14px;overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:#9aa09b}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:12px}.tag{background:#f1f2ee;padding:2px 7px;border-radius:6px;font-size:11px}.tag.school{background:#edf1f8;color:#51658b}.tag.home{background:#faf0e8;color:#9c643c}.tag.other{background:#f1eef7;color:#76628c}.due.overdue{color:var(--red);font-weight:650}.due.soon{color:var(--orange);font-weight:650}.delete{border:0;background:transparent;color:#a5aaa5;border-radius:7px;padding:4px 7px;font-size:18px;line-height:1}.delete:hover{background:#f8ecea;color:var(--red)}.empty{text-align:center;padding:45px 12px;color:var(--muted)}.empty-icon{font-size:26px;margin-bottom:6px}.side{padding:22px}.side h2{font-size:15px;margin:0 0 16px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f8f8f5;border-radius:12px;padding:13px}.stat b{display:block;font-size:23px;line-height:1.1}.stat span{font-size:12px;color:var(--muted)}.side-divider{height:1px;background:var(--line);margin:20px 0}.tip{background:#f4f7f3;border-radius:12px;padding:14px;color:#526457;font-size:13px}.tip strong{display:block;margin-bottom:4px;color:var(--green)}.remind{border:1px solid var(--line);background:white;border-radius:9px;color:var(--green);padding:9px 11px;width:100%;font-size:12px;font-weight:650;margin-top:12px}.remind:hover{background:#f6f8f5}.foot{margin-top:18px;color:#9aa09b;font-size:11px;text-align:center}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#263a2d;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.shell{padding:26px 16px 48px}.top{margin-bottom:32px}.layout{grid-template-columns:1fr}.side{order:-1}.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}.add{min-height:42px}.hero{grid-template-columns:1fr}.count-pill{justify-self:start}.summary{grid-template-columns:repeat(4,1fr)}.stat{padding:10px}.stat b{font-size:20px}}@media(max-width:430px){.main,.side{padding:16px}.section-head{align-items:flex-start;flex-direction:column}.filters{width:100%}.filter{padding:7px 8px}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="mark">✓</div>记得做</div><div class="today" id="today"></div></header>
<section class="hero"><div><div class="eyebrow">把事情放在这里</div><h1>少一点惦记，<br>多一点从容。</h1><p>作业、家务和生活里的小事，都记下来。</p></div><div class="count-pill" id="openCount">0 件待完成</div></section>
<div class="layout"><main class="panel main"><div class="section-head"><h2>我的事项</h2><div class="filters" id="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="school">作业</button><button class="filter" data-filter="home">家务</button><button class="filter" data-filter="other">其他</button></div></div>
<form class="form" id="taskForm"><input id="titleInput" maxlength="100" placeholder="要记住什么？例如：交数学作业" required><select id="category"><option value="school">📚 作业</option><option value="home">🏠 家务</option><option value="other">✦ 其他</option></select><input id="dueInput" type="datetime-local" aria-label="截止时间"><button class="add" type="submit">＋ 添加</button></form><div class="list" id="taskList"></div></main>
<aside class="panel side"><h2>进度一览</h2><div class="summary"><div class="stat"><b id="totalStat">0</b><span>全部事项</span></div><div class="stat"><b id="doneStat">0</b><span>已完成</span></div><div class="stat"><b id="dueStat">0</b><span>今天到期</span></div><div class="stat"><b id="lateStat">0</b><span>已经逾期</span></div></div><div class="side-divider"></div><div class="tip"><strong>一个小建议</strong>把截止时间也记上，就更容易提前安排。完成后点一下左边的圆框，心里就清爽一件。</div><button class="remind" id="installBtn" hidden>安装到手机或电脑</button><button class="remind" id="notifyBtn">开启到期通知</button><div class="foot">事项只保存在这台设备的浏览器中</div></aside></div>
</div><div class="toast" id="toast"></div>
<script>
const KEY='jidezuo.tasks.v1';let tasks=loadTasks();let activeFilter='all';let notified=new Set();
const labels={school:'作业',home:'家务',other:'其他'};
function loadTasks(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(v){if(!v)return '未设截止时间';const d=new Date(v);if(isNaN(d))return '未设截止时间';const now=new Date(),tomorrow=new Date(now);tomorrow.setDate(now.getDate()+1);const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();let day=same(d,now)?'今天':same(d,tomorrow)?'明天':`${d.getMonth()+1}月${d.getDate()}日`;return `${day} ${d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}`}
function render(){const now=new Date(),today=now.toDateString();const open=tasks.filter(t=>!t.done);document.getElementById('openCount').textContent=`${open.length} 件待完成`;document.getElementById('totalStat').textContent=tasks.length;document.getElementById('doneStat').textContent=tasks.filter(t=>t.done).length;document.getElementById('dueStat').textContent=open.filter(t=>t.due&&new Date(t.due).toDateString()===today).length;document.getElementById('lateStat').textContent=open.filter(t=>t.due&&new Date(t.due)<now).length;const items=tasks.filter(t=>activeFilter==='all'||t.category===activeFilter).sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;if(!a.due)return 1;if(!b.due)return -1;return new Date(a.due)-new Date(b.due)});const list=document.getElementById('taskList');if(!items.length){list.innerHTML=`<div class="empty"><div class="empty-icon">${tasks.length?'☀':'✎'}</div>${tasks.length?'这个分类还没有事项。':'还没有事项，先记下一件试试吧。'}</div>`;return}list.innerHTML=items.map(t=>{let late=!t.done&&t.due&&new Date(t.due)<now,soon=!t.done&&t.due&&!late&&(new Date(t.due)-now)<86400000;return `<article class="task ${t.done?'done':''}"><input class="check" type="checkbox" aria-label="标记完成" data-id="${t.id}" ${t.done?'checked':''}><div><div class="task-title">${safe(t.title)}</div><div class="meta"><span class="tag ${t.category}">${labels[t.category]}</span><span class="due ${late?'overdue':soon?'soon':''}">${late?'已逾期 · ':''}${dateLabel(t.due)}</span></div></div><button class="delete" data-delete="${t.id}" title="删除" aria-label="删除事项">×</button></article>`}).join('')}
document.getElementById('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('titleInput').value.trim();if(!title)return;tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,category:document.getElementById('category').value,due:document.getElementById('dueInput').value,done:false,created:Date.now()});e.target.reset();save();document.getElementById('titleInput').focus();toast('记下了')});
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});
document.getElementById('taskList').addEventListener('change',e=>{if(!e.target.matches('.check'))return;const t=tasks.find(x=>x.id===e.target.dataset.id);if(t){t.done=e.target.checked;save();if(t.done)toast('完成一件，做得好')}});
document.getElementById('taskList').addEventListener('click',e=>{const b=e.target.closest('[data-delete]');if(!b)return;tasks=tasks.filter(t=>t.id!==b.dataset.delete);save();toast('已删除')});
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
document.getElementById('notifyBtn').addEventListener('click',async()=>{if(!('Notification'in window)){toast('这个浏览器不支持通知');return}const p=await Notification.requestPermission();toast(p==='granted'?'到期通知已开启':'没有开启通知')});
function checkDue(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now();tasks.filter(t=>!t.done&&t.due).forEach(t=>{const due=new Date(t.due).getTime(),key=t.id+':'+t.due;if(due<=now&&due>now-60000&&!notified.has(key)){new Notification('事项到期了',{body:t.title});notified.add(key)}})}
const now=new Date();document.getElementById('today').textContent=now.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});render();checkDue();setInterval(checkDue,30000);
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
let installPrompt;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.hidden=false});installBtn.addEventListener('click',async()=>{if(!installPrompt){toast('请使用浏览器菜单中的“安装应用”或“添加到主屏幕”');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.hidden=true});window.addEventListener('appinstalled',()=>{installBtn.hidden=true;toast('应用已安装')});
</script>
</body></html>
