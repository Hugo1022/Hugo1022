<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>果果蛇 · 贪吃蛇小游戏</title>
<style>
:root{color-scheme:dark;--bg:#10151b;--panel:#192129;--line:#2a3942;--mint:#9bffc4;--lime:#d6ff85;--muted:#91a19e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 5%,#20342e 0%,#10151b 52%);color:#f3f7ef;font-family:ui-rounded,"Segoe UI","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,560px)}header{display:flex;align-items:end;justify-content:space-between;margin:0 2px 15px}.eyebrow{color:var(--mint);font-size:12px;letter-spacing:.16em;font-weight:800}h1{font-size:clamp(28px,7vw,40px);line-height:1;margin:6px 0 0;letter-spacing:-.05em}.scorebox{display:flex;gap:9px}.stat{background:#192129cf;border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:76px;text-align:center}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:20px;color:var(--lime)}.board{position:relative;overflow:hidden;border:1px solid #3c554d;border-radius:20px;background:#121b1c;box-shadow:0 22px 70px #0007;touch-action:none}.board:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,#ffffff08,transparent 35%)}canvas{display:block;width:100%;height:auto;aspect-ratio:1}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#101719b8;backdrop-filter:blur(4px);text-align:center;padding:24px}.overlay.hidden{display:none}.card{max-width:300px}.emoji{font-size:42px;filter:drop-shadow(0 5px 16px #9bffc466)}.card h2{font-size:26px;margin:7px 0}.card p{color:#b7c7c0;line-height:1.65;font-size:14px;margin:7px 0 18px}.button{appearance:none;border:0;border-radius:13px;padding:12px 24px;background:var(--lime);color:#172018;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #95b959;transition:transform .12s,filter .12s}.button:hover{filter:brightness(1.06);transform:translateY(-1px)}.button:active{transform:translateY(3px);box-shadow:0 2px 0 #95b959}.under{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:13px 3px 0;color:var(--muted);font-size:12px}.under strong{color:#d6e2d8;font-weight:650}.controls{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin:18px auto 0;user-select:none}.controls button{border:1px solid #34443f;border-radius:13px;background:#1b2827;color:#d9f7dc;font-size:20px;touch-action:manipulation}.controls button:active{background:#314d3b}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.pause{background:transparent;color:#d7e8dc;border:1px solid #3b5049;border-radius:9px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}@media(max-width:620px){body{padding:14px}.controls{display:grid}.under{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main class="wrap"><header><div><div class="eyebrow">TINY ARCADE　/　01</div><h1>果果蛇 <span style="color:var(--mint)">🍏</span></h1></div><div class="scorebox"><div class="stat"><small>本局得分</small><b id="score">0</b></div><div class="stat"><small>最高纪录</small><b id="best">0</b></div></div></header><section class="board" id="board"><canvas id="game" width="480" height="480" aria-label="贪吃蛇游戏区域"></canvas><div class="overlay" id="overlay"><div class="card"><div class="emoji" id="ovEmoji">🐍</div><h2 id="ovTitle">准备好了吗？</h2><p id="ovText">吃掉果实，让小蛇长长。<br>小心别撞到墙或自己哦！</p><button class="button" id="start">开始游戏</button></div></div></section><div class="under"><span>⌨ <strong>方向键 / WASD</strong> 移动　·　<strong>空格</strong> 暂停</span><button class="pause" id="pause">Ⅱ　暂停</button></div><div class="controls" aria-label="触屏方向控制"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div></main>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),startBtn=document.querySelector('#start'),pauseBtn=document.querySelector('#pause');const N=20,S=24;let snake,dir,nextDir,food,score,best=Number(localStorage.getItem('guoguo-best')||0),state='ready',timer=null,stepMs=145,particles=[];bestEl.textContent=best;const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};function placeFood(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir=dir;score=0;stepMs=145;scoreEl.textContent=0;particles=[];placeFood();draw()}function start(){reset();state='playing';overlay.classList.add('hidden');pauseBtn.textContent='Ⅱ　暂停';clearInterval(timer);timer=setInterval(tick,stepMs)}function setDirection(name){const d=dirs[name];if(!d||state==='over'||state==='ready')return;if(d.x!==-dir.x||d.y!==-dir.y)nextDir={x:d[0],y:d[1]}}function tick(){if(state!=='playing')return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eating=head.x===food.x&&head.y===food.y;const body=eating?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=N||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){gameOver();return}snake.unshift(head);if(eating){score+=10;scoreEl.textContent=score;for(let i=0;i<12;i++)particles.push({x:(food.x+.5)*S,y:(food.y+.5)*S,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:1});placeFood();if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('guoguo-best',best)}if(score%50===0){clearInterval(timer);stepMs=Math.max(75,stepMs-10);timer=setInterval(tick,stepMs)}}else snake.pop();draw()}function gameOver(){state='over';clearInterval(timer);document.querySelector('#ovEmoji').textContent='💥';document.querySelector('#ovTitle').textContent='哎呀，撞到了！';document.querySelector('#ovText').innerHTML=`这局拿下 <b style="color:#d6ff85">${score}</b> 分。<br>再来一局，看看能不能更长？`;startBtn.textContent='再玩一次';overlay.classList.remove('hidden')}function togglePause(){if(state==='playing'){state='paused';clearInterval(timer);document.querySelector('#ovEmoji').textContent='⏸️';document.querySelector('#ovTitle').textContent='休息一下';document.querySelector('#ovText').textContent='按空格或点击继续，果果蛇等你。';startBtn.textContent='继续游戏';overlay.classList.remove('hidden');pauseBtn.textContent='▶　继续'}else if(state==='paused'){state='playing';overlay.classList.add('hidden');pauseBtn.textContent='Ⅱ　暂停';timer=setInterval(tick,stepMs)}}function draw(){ctx.clearRect(0,0,480,480);ctx.fillStyle='#121b1c';ctx.fillRect(0,0,480,480);ctx.strokeStyle='rgba(172,231,190,.045)';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(480,i*S);ctx.stroke()}const t=performance.now()/1000;const fx=(food.x+.5)*S,fy=(food.y+.5)*S,pulse=1+Math.sin(t*5)*.08;ctx.shadowColor='#ffbd63';ctx.shadowBlur=17;ctx.fillStyle='#ffbd63';ctx.beginPath();ctx.arc(fx,fy,7.5*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#a7f58e';ctx.beginPath();ctx.ellipse(fx+4,fy-9,4,2.5,-.65,0,Math.PI*2);ctx.fill();for(let i=snake.length-1;i>=0;i--){const p=snake[i],pad=i===0?2.5:3.2,x=p.x*S+pad,y=p.y*S+pad,w=S-pad*2;ctx.fillStyle=i===0?'#c6ff9d':`hsl(${145-i*1.1} ${Math.max(42,58-i*.16)}% ${Math.max(33,49-i*.15)}%)`;ctx.beginPath();ctx.roundRect(x,y,w,w, i===0?8:6);ctx.fill();if(i===0){const ex=x+S/2-2+dir.x*4,ey=y+S/2-2+dir.y*4,perp={x:-dir.y,y:dir.x};ctx.fillStyle='#16392a';for(const side of [-1,1]){ctx.beginPath();ctx.arc(ex+perp.x*4*side,ey+perp.y*4*side,1.7,0,Math.PI*2);ctx.fill()}}}particles=particles.filter(q=>q.life>0);for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.life-=.045;ctx.globalAlpha=q.life;ctx.fillStyle='#d6ff85';ctx.beginPath();ctx.arc(q.x,q.y,2.5*q.life,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();setDirection(map[e.key])}if(e.code==='Space'){e.preventDefault();if(state==='playing'||state==='paused')togglePause();else start()}});document.querySelectorAll('[data-dir]').forEach(b=>{const act=e=>{e.preventDefault();setDirection(b.dataset.dir)};b.addEventListener('pointerdown',act)});startBtn.addEventListener('click',()=>state==='paused'?togglePause():start());pauseBtn.addEventListener('click',togglePause);let touch=null;document.querySelector('#board').addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});document.querySelector('#board').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24)setDirection(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');touch=null},{passive:true});reset();setInterval(()=>{if(state==='playing')draw()},50)})();
</script></body></html>
